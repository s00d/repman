x-restart-policy: &restart_policy
  restart: unless-stopped

# app, consumer and cron run the same image, built from this checkout. To use a published image
# instead, set REPMAN_IMAGE (e.g. buddy/repman:1.5.0) and run `docker compose up --no-build`.
x-repman-image: &repman_image
  image: ${REPMAN_IMAGE:-repman:local}
  build: .

services:
  database:
    << : *restart_policy
    image: postgres:17-alpine
    logging:
      driver: none
    environment:
      POSTGRES_USER: main
      POSTGRES_PASSWORD: main
      POSTGRES_DB: main
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # each service starts as root only to hand var/ (a bind mount, possibly written by an older
  # version as root) to www-data, then runs as www-data; php-fpm's workers run as www-data
  app:
    << : [*restart_policy, *repman_image]
    sysctls:
      net.core.somaxconn: 2048
    command: >
      bash -c 'chown -R www-data:www-data var &&
      su-exec www-data bin/console d:m:m --no-interaction &&
      su-exec www-data bin/console messenger:setup-transports --no-interaction &&
      su-exec www-data bin/console repman:security:update-db &&
      su-exec www-data bin/console assets:install &&
      php-fpm'
    env_file: .env.docker
    volumes:
      - app-var:/app/var
      - /app/var/cache
      - app-public:/app/public
    depends_on:
      - database

  consumer:
    << : [*restart_policy, *repman_image]
    command: >
      sh -c 'chown -R www-data:www-data var/cache &&
      exec su-exec www-data bin/console messenger:consume async --limit=500'
    env_file: .env.docker
    volumes:
      - app-var:/app/var
      - /app/var/cache
    depends_on:
      - app

  # crond itself runs as root; the jobs in docker/crontabs/www-data run as www-data
  cron:
    << : [*restart_policy, *repman_image]
    command: >
      sh -c 'chown -R www-data:www-data var/cache &&
      exec crond -f -L /app/var/log/cron.log'
    env_file: .env.docker
    volumes:
      - app-var:/app/var
      - /app/var/cache
      - docker-crontabs:/var/spool/cron/crontabs
    depends_on:
      - app

  nginx:
    << : *restart_policy
    image: nginx:1.30-alpine
    env_file: .env.docker
    command: ['/nginx/start.sh']
    ports:
      - 443:443
    depends_on:
      - app
    volumes:
      - app-public:/app/public
      - docker-logs-nginx:/var/log/nginx
      - docker-nginx-scripts:/nginx
      - docker-nginx-ssl-certs:/etc/ssl/certs
      - docker-nginx-ssl-private:/etc/ssl/private

volumes:
  postgres-data:
  app-var:
    driver: local
    driver_opts:
      type: none
      device: $PWD/var
      o: bind
  app-public:
    driver: local
    driver_opts:
      type: none
      device: $PWD/public
      o: bind
  docker-logs-nginx:
    driver: local
    driver_opts:
      type: none
      device: $PWD/docker/logs/nginx
      o: bind
  docker-nginx-scripts:
    driver: local
    driver_opts:
      type: none
      device: $PWD/docker/nginx/scripts
      o: bind
  docker-nginx-ssl-certs:
    driver: local
    driver_opts:
      type: none
      device: $PWD/docker/nginx/ssl/certs
      o: bind
  docker-nginx-ssl-private:
    driver: local
    driver_opts:
      type: none
      device: $PWD/docker/nginx/ssl/private
      o: bind
  docker-crontabs:
    driver: local
    driver_opts:
      type: none
      device: $PWD/docker/crontabs
      o: bind
